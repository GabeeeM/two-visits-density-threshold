      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "autonomous"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A shell orchestrator runs Claude Code sessions back to back with a fixed prompt: choose an
        open conjecture with a practical use, check it is still open (literature and Palomar),
        explore in Julia, and verify the final result in Lean 4 with Mathlib (no sorry, only
        propext / Classical.choice / Quot.sound). The session that produced this result chose the
        problem, ran the Julia experiments, found the construction, and wrote the Lean proof.
      cost:
        wall_time: "about 8 hours for the producing session"
        hardware: "API model; a local workstation CPU for Julia and Lean"
      prompting_notes: >-
        The operator did not suggest the problem, the proof idea or any Lean code; the operator
        told the session mid-run to stay on this problem rather than switch to another.
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A separate session ported the proof to this repository (Lean v4.35.0-rc2, module system,
        Challenge/Solution split) and performed the independent check described under review.
  spend_usd: "subscription-based usage"
  notes: "The human operator (Gabriel Mack) is not a mathematician and did not write the mathematics."

fidelity:
  divergences: >-
    Positions are 0-indexed in Lean (position p is the paper's position p+1). Deadlines are
    arbitrary positive naturals (the paper's Remark 1 assumption d_i <= 2n is not needed).
    Density is computed in the rationals.

review:
  status: "agent-reviewed"
  reviewers: ["Independent Claude Code session (Claude Opus 5.5), distinct from the producing session"]
  notes: >-
    The reviewing session recompiled the proof, scanned it for sorry, native_decide and custom
    axioms, checked #print axioms, and proved in Lean that the theorem yields a schedule under an
    independently written 1-indexed restatement of Definition 2 of arXiv:2604.16030. No human
    mathematician has reviewed the proof.

alignment:
  namespace: "TwoVisits"
  statements:
    - source: "arXiv:2604.16030, Definition 2 (k = 2)"
      lean: "TwoVisits.IsSchedule"
      module: "Challenge"
      status: "proved"
      note: "Definition, stated identically in Challenge and Solution."
    - source: "arXiv:2604.16030, Section 8 question (lower density threshold of 2-Visits is exactly 1)"
      lean: "TwoVisits.two_visits_density_threshold"
      module: "Solution"
      status: "proved"

acknowledgements: "Mathlib, Lean, Comparator, Palomar."
