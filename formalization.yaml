  msc2020: ["90B35", "68W40", "05C70"]

status:
  scope: "Complete: both halves of the density-threshold statement are proved."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
